<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<h1>Бронирование</h1>

<form id="bookingForm">
<input id="name" placeholder="Имя" required>
<input id="email" placeholder="Email" required>
<input id="date" type="date" required>
<textarea id="message" placeholder="Комментарий"></textarea>
<button>Отправить</button>
</form>

<div id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "ТВОЙ_FIREBASE_API_KEY",
  authDomain: "ТВОЙ_FIREBASE_PROJECT.firebaseapp.com",
  databaseURL: "https://ТВОЙ_FIREBASE_PROJECT.firebaseio.com",
  projectId: "ТВОЙ_FIREBASE_PROJECT",
  storageBucket: "ТВОЙ_FIREBASE_PROJECT.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

bookingForm.onsubmit = function(e){
 e.preventDefault();
 const app = {
   name:name.value,
   email:email.value,
   date:date.value,
   message:message.value,
   time:new Date().toISOString()
 };
 db.ref("applications").push(app);
 showToast("Заявка отправлена!");
 setTimeout(()=>location.href="thanks.html",1000);
}

function showToast(msg){
 const t=document.getElementById("toast");
 t.innerText=msg; t.style.display="block";
 setTimeout(()=>t.style.display="none",2000);
}
</script>
</body>
</html>
