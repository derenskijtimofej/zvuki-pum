<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование — Звуки Пум</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="logo">Звуки Пум</div>
      <nav class="nav">
        <a href="index.html">Главная</a>
        <a href="booking.html">Форма</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section-booking">
      <div class="container">
        <h2>Бронирование выступления</h2>

        <div class="band-info">
          <img src="band.png" alt="Группа Звуки Пум" class="band-photo">
          <ul>
            <li><strong>Участник 1:</strong> вокалист, баянист и пианист</li>
            <li><strong>Участник 2:</strong> гитарист</li>
          </ul>
        </div>

        <form action="https://api.web3forms.com/submit" method="POST" class="booking-form">
          <input type="hidden" name="access_key" value="d501d267-ddcc-46bd-bd12-726473c7370d">
          <label>Имя</label>
          <input type="text" name="name" required>
          <label>Электронная почта</label>
          <input type="email" name="email" required>
          <label>Дата мероприятия</label>
          <input type="date" name="date" required>
          <label>Комментарий</label>
          <textarea name="message"></textarea>
          <button type="submit" class="btn btn-primary">Отправить заявку</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 Звуки Пум. Все права защищены.</p>
    </div>
  </footer>
</body>
</html>
