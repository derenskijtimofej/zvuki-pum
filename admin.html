<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Звуки Пум</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0c1020; color: #fff; font-family: 'Poppins', sans-serif; }
    .container { width: min(1200px, 90%); margin: 0 auto; padding: 40px 0; }
    h1 { font-size: 2.5rem; margin-bottom: 24px; }
    .admin-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 24px; margin-bottom: 24px; }
    .admin-card h2 { margin-top: 0; }
    .admin-form { display: grid; gap: 14px; }
    .admin-form input, .admin-form textarea { width: 100%; padding: 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: #fff; }
    .admin-form textarea { min-height: 100px; resize: vertical; }
    .btn { padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #63dfff; color: #0c1020; border: none; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Админ-панель</h1>

    <div class="admin-card">
      <h2>Редактор афиши</h2>
      <p>Здесь можно добавить/изменить афишу выступлений</p>
      <div class="admin-form">
        <textarea id="poster1">12 апреля — Весенний концерт — Школьная сцена · 17:00 — Скоро</textarea>
        <textarea id="poster2">20 апреля — Праздник музыки — Детский центр · 15:30 — Открыта запись</textarea>
        <textarea id="poster3">4 мая — Городской фестиваль — Центральная площадка · 13:00 — Live</textarea>
      </div>
      <button class="btn btn-primary" onclick="saveAdminData()">Сохранить</button>
    </div>

    <div class="admin-card">
      <h2>Контакты и описание</h2>
      <div class="admin-form">
        <input id="phone" type="text" value="+7 (900) 123-45-67">
        <input id="email" type="text" value="zvukipum@example.com">
        <textarea id="about">«Звуки Пум» — музыкальная группа из двух участников: вокалист/баянист/пианист и гитарист.</textarea>
      </div>
    </div>
  </div>

  <script>
    const defaultAdminData = {
      poster1: "12 апреля — Весенний концерт — Школьная сцена · 17:00 — Скоро",
      poster2: "20 апреля — Праздник музыки — Детский центр · 15:30 — Открыта запись",
      poster3: "4 мая — Городской фестиваль — Центральная площадка · 13:00 — Live",
      phone: "+7 (900) 123-45-67",
      email: "zvukipum@example.com",
      about: "«Звуки Пум» — музыкальная группа из двух участников: вокалист/баянист/пианист и гитарист."
    };

    function getFields() {
      return {
        poster1: document.getElementById("poster1"),
        poster2: document.getElementById("poster2"),
        poster3: document.getElementById("poster3"),
        phone: document.getElementById("phone"),
        email: document.getElementById("email"),
        about: document.getElementById("about")
      };
    }

    function saveAdminData() {
      const f = getFields();
      const data = {
        poster1: f.poster1.value,
        poster2: f.poster2.value,
        poster3: f.poster3.value,
        phone: f.phone.value,
        email: f.email.value,
        about: f.about.value
      };
      localStorage.setItem("zvukiPumAdminData", JSON.stringify(data));
      alert("Данные сохранены в браузере");
    }

    function loadAdminData() {
      const saved = localStorage.getItem("zvukiPumAdminData");
      const data = saved ? JSON.parse(saved) : defaultAdminData;
      const f = getFields();
      Object.keys(defaultAdminData).forEach(key => { f[key].value = data[key] ?? defaultAdminData[key]; });
    }

    loadAdminData();
  </script>
</body>
</html>
