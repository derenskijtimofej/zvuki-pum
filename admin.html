<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<h1>Админ панель</h1>

<h2>Афиша</h2>
<textarea id="p1"></textarea>
<textarea id="p2"></textarea>
<textarea id="p3"></textarea>
<button onclick="saveAfisha()">Сохранить</button>

<h2>Заявки</h2>
<div id="apps"></div>
<button onclick="exportCSV()">Скачать CSV</button>

<script>
const firebaseConfig = {
  apiKey: "ТВОЙ_FIREBASE_API_KEY",
  authDomain: "ТВОЙ_FIREBASE_PROJECT.firebaseapp.com",
  databaseURL: "https://ТВОЙ_FIREBASE_PROJECT.firebaseio.com",
  projectId: "ТВОЙ_FIREBASE_PROJECT",
  storageBucket: "ТВОЙ_FIREBASE_PROJECT.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234567890:web:abcdef123456"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

/* Афиша */
function saveAfisha(){
 db.ref("afisha").set({
  poster1:p1.value,
  poster2:p2.value,
  poster3:p3.value
 });
 alert("Сохранено");
}

/* Заявки */
db.ref("applications").on("value",snap=>{
 const data = snap.val()||{};
 let html="";
 Object.keys(data).forEach(k=>{
  const a = data[k];
  html+=`<div class="card"><b>${a.name}</b><br>${a.email}<br>${a.date}<br>${a.message}<br><button onclick="star('${k}')">⭐</button><button onclick="del('${k}')">❌</button></div>`;
 });
 apps.innerHTML=html;
});

function star(k){ db.ref("applications/"+k+"/star").set(true); }
function del(k){ db.ref("applications/"+k).remove(); }

/* CSV */
function exportCSV(){
 db.ref("applications").once("value").then(snap=>{
   const data = snap.val()||{};
   let csv="name,email,date,message\n";
   Object.values(data).forEach(a=>{csv+=`${a.name},${a.email},${a.date},${a.message}\n`;});
   const blob=new Blob([csv]);
   const a=document.createElement("a");
   a.href=URL.createObjectURL(blob);
   a.download="apps.csv";
   a.click();
 });
}
</script>
</body>
</html>
